services:
  postgres:
    image: postgres:17-alpine
    container_name: syncup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-syncup_control}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - syncup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncup} -d ${POSTGRES_DB:-syncup_control}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  syncup-postgres-data:
